
[functions.compute-election-hash]
enabled = true
verify_jwt = true
import_map = "./functions/compute-election-hash/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/compute-election-hash/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/compute-election-hash/*.html" ]

[functions.resend-email]
enabled = true
verify_jwt = false
import_map = "./functions/resend-email/deno.json"
entrypoint = "./functions/resend-email/index.ts"

[functions.send-invitations]
enabled = true
verify_jwt = true
import_map = "./functions/send-invitations/deno.json"
entrypoint = "./functions/send-invitations/index.ts"

[functions.send-reminders]
enabled = true
verify_jwt = true
import_map = "./functions/send-reminders/deno.json"
entrypoint = "./functions/send-reminders/index.ts"
